apiVersion: v1
kind: Service
metadata:
  name: mcp-woo
spec:
  type: ClusterIP
  selector:
    app: mcp-woo
  ports:
  - port: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-woo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-woo
  template:
    metadata:
      labels:
        app: mcp-woo
    spec:
      containers:
      - name: mcp-woo
        image: mcp-woo:0.1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        env:
        - name: WOO_BASE_URL
          value: http://wordpress.store.svc.cluster.local
        - name: WOO_HOST_HEADER
          value: store.localtest.me:8080
        - name: WOO_CONSUMER_KEY
          valueFrom:
            secretKeyRef:
              name: woo-api-keys
              key: consumer-key
        - name: WOO_CONSUMER_SECRET
          valueFrom:
            secretKeyRef:
              name: woo-api-keys
              key: consumer-secret
        readinessProbe:
          httpGet:
            path: /healthz
            port: 3000
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 20
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 128Mi
