apiVersion: v1
kind: Service
metadata:
  name: mcp-notes
spec:
  type: ClusterIP
  selector:
    app: mcp-notes
  ports:
  - port: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-notes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-notes
  template:
    metadata:
      labels:
        app: mcp-notes
    spec:
      containers:
      - name: mcp-notes
        image: mcp-extra:0.1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        env:
        - name: SERVER_KIND
          value: notes
        readinessProbe:
          httpGet: {path: /healthz, port: 3000}
          periodSeconds: 10
        livenessProbe:
          httpGet: {path: /healthz, port: 3000}
          initialDelaySeconds: 10
          periodSeconds: 20
        resources:
          requests: {cpu: 25m, memory: 48Mi}
          limits: {cpu: 200m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-utils
spec:
  type: ClusterIP
  selector:
    app: mcp-utils
  ports:
  - port: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-utils
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-utils
  template:
    metadata:
      labels:
        app: mcp-utils
    spec:
      containers:
      - name: mcp-utils
        image: mcp-extra:0.1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        env:
        - name: SERVER_KIND
          value: utils
        readinessProbe:
          httpGet: {path: /healthz, port: 3000}
          periodSeconds: 10
        livenessProbe:
          httpGet: {path: /healthz, port: 3000}
          initialDelaySeconds: 10
          periodSeconds: 20
        resources:
          requests: {cpu: 25m, memory: 48Mi}
          limits: {cpu: 200m, memory: 128Mi}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-extra-allow-gateway-only
spec:
  podSelector:
    matchExpressions:
    - key: app
      operator: In
      values: [mcp-notes, mcp-utils]
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: gateway
    ports:
    - port: 3000
