apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gateway-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  type: ClusterIP
  selector:
    app: gateway
  ports:
  - port: 4000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      securityContext:
        fsGroup: 1000
      containers:
      - name: gateway
        image: mcp-gateway:0.1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 4000
        env:
        - name: UPSTREAM_TIMEOUT_MS
          value: "20000"
        - name: GEMINI_MODEL
          value: gemini-3.5-flash-lite
        - name: CREDENTIAL_KEY
          valueFrom:
            secretKeyRef:
              name: gateway-secrets
              key: credential-key
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: gateway-secrets
              key: gemini-api-key
        readinessProbe:
          httpGet:
            path: /healthz
            port: 4000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 4000
          initialDelaySeconds: 20
          periodSeconds: 20
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 384Mi
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: gateway-data
