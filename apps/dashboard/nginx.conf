server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://gateway.mcp.svc.cluster.local:4000;
    proxy_read_timeout 120s;
  }
  location /mcp {
    proxy_pass http://gateway.mcp.svc.cluster.local:4000;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 120s;
  }
  location / {
    try_files $uri /index.html;
  }
}
